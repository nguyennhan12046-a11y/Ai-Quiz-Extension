<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Answer Assistant — Test Quiz</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  h1 { color: #4f46e5; }
  fieldset { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 16px 0; }
  legend { font-weight: 600; color: #334155; }
  label { display: block; padding: 6px 0; cursor: pointer; }
  input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
  select { padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
  .question-block { margin: 24px 0; }
  .question-block p { font-weight: 600; }
</style>
</head>
<body>

<h1>Sample Quiz</h1>
<form id="quizForm">

  <!-- Multiple choice -->
  <fieldset>
    <legend>What is the capital of France?</legend>
    <label><input type="radio" name="q1" value="london"> London</label>
    <label><input type="radio" name="q1" value="paris"> Paris</label>
    <label><input type="radio" name="q1" value="berlin"> Berlin</label>
    <label><input type="radio" name="q1" value="madrid"> Madrid</label>
  </fieldset>

  <!-- Multiple choice 2 -->
  <div class="question-block">
    <p>Which planet is known as the Red Planet?</p>
    <label><input type="radio" name="q2" value="venus"> Venus</label>
    <label><input type="radio" name="q2" value="mars"> Mars</label>
    <label><input type="radio" name="q2" value="jupiter"> Jupiter</label>
  </div>

  <!-- Checkboxes -->
  <fieldset>
    <legend>Which of these are programming languages? (Select all that apply)</legend>
    <label><input type="checkbox" name="q3" value="python"> Python</label>
    <label><input type="checkbox" name="q3" value="html"> HTML</label>
    <label><input type="checkbox" name="q3" value="java"> Java</label>
    <label><input type="checkbox" name="q3" value="css"> CSS</label>
  </fieldset>

  <!-- Text input -->
  <div class="question-block">
    <label for="q4">What is 2 + 2?</label>
    <input type="text" id="q4" name="q4" />
  </div>

  <!-- Select dropdown -->
  <div class="question-block">
    <label for="q5">Which year did World War II end?</label>
    <select id="q5" name="q5">
      <option value="">-- Select --</option>
      <option value="1943">1943</option>
      <option value="1944">1944</option>
      <option value="1945">1945</option>
      <option value="1946">1946</option>
    </select>
  </div>

  <!-- Textarea -->
  <div class="question-block">
    <label for="q6">What does "HTTP" stand for?</label>
    <textarea id="q6" name="q6" rows="2"></textarea>
  </div>

</form>

<p style="color:#94a3b8; font-size:12px; margin-top:40px;">
  Install the AI Answer Assistant extension, click its icon, and press "Detect Questions" then "Answer All".
</p>

</body>
</html>
